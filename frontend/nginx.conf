# Sert uniquement les fichiers statiques. En prod, le reverse proxy (docker/nginx.conf)
# route / vers ce conteneur et /api vers le backend.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
