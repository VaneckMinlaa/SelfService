services:
  # ============================================
  # DATABASES (One per service)
  # ============================================

  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${DB_USERNAME:-bankadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bankadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  postgres-account:
    image: postgres:15-alpine
    container_name: postgres-account
    environment:
      POSTGRES_DB: ${ACCOUNT_DB_NAME:-account_db}
      POSTGRES_USER: ${DB_USERNAME:-bankadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-account-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bankadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  postgres-transaction:
    image: postgres:15-alpine
    container_name: postgres-transaction
    environment:
      POSTGRES_DB: ${TRANSACTION_DB_NAME:-transaction_db}
      POSTGRES_USER: ${DB_USERNAME:-bankadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-transaction-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bankadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  # ============================================
  # MESSAGE BROKER
  # ============================================

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  # ============================================
  # MICROSERVICES
  # ============================================

  auth-service:
    build: ./Auth-Service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/${AUTH_DB_NAME:-auth_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-bankadmin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SECURITY_JWT_SECRET: ${JWT_SECRET:-your-secret-key-minimum-32-characters-here}
      SECURITY_JWT_EXPIRATION: 3600000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/api/auth/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - banking-network

  account-service:
    build: ./Account-Service
    container_name: account-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-account:5432/${ACCOUNT_DB_NAME:-account_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-bankadmin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SECURITY_JWT_SECRET: ${JWT_SECRET:-your-secret-key-minimum-32-characters-here}
      SECURITY_JWT_EXPIRATION: 3600000
      AUTH_SERVICE_URL: http://auth-service:8081
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres-account:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8082/api/accounts/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - banking-network

  transaction-service:
    build: ./Transaction-Service
    container_name: transaction-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-transaction:5432/${TRANSACTION_DB_NAME:-transaction_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-bankadmin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SECURITY_JWT_SECRET: ${JWT_SECRET:-your-secret-key-minimum-32-characters-here}
      SECURITY_JWT_EXPIRATION: 3600000
      AUTH_SERVICE_URL: http://auth-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres-transaction:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8083/api/transactions/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - banking-network

  notification-service:
    build: ./Notification-Service
    container_name: notification-service
    ports:
      - "8084:8084"
    environment:
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SPRING_MAIL_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-your-email@gmail.com}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-app-password}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-noreply@banking.local}
      BREVO_API_KEY: ${BREVO_API_KEY:-your_brevo_api_key_here}
      AUTH_SERVICE_URL: http://auth-service:8081
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - banking-network

  # ============================================
  # API GATEWAY (Nginx)
  # ============================================

  nginx:
    build: ./Nginx
    container_name: nginx-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Nginx/ssl:/etc/nginx/ssl:ro
      - ./Front-End/dist:/usr/share/nginx/html:ro
    depends_on:
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    networks:
      - banking-network

  # ============================================
  # FRONTEND (served by Nginx)
  # ============================================

  frontend:
    build: ./Front-End
    container_name: frontend
    depends_on:
      - nginx
    networks:
      - banking-network

  # ============================================
  # OBSERVABILITY (Monitoring CPU/RAM & Metrics)
  # ============================================

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    volumes:
      - ./Docker/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - banking-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    privileged: true
    networks:
      - banking-network

  grafana:
    image: grafana/grafana:10.0.3
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - banking-network

volumes:
  postgres-auth-data:
  postgres-account-data:
  postgres-transaction-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:

networks:
  banking-network:
    driver: bridge
