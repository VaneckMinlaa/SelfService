# Upstream declarations for microservices
upstream auth_service {
    server auth-service:8081;
}

upstream account_service {
    server account-service:8082;
}

upstream transaction_service {
    server transaction-service:8083;
}

# Rate limiting (5 requests per second per IP)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

# HTTPS Server Block
server {
    listen 443 ssl http2;
    server_name localhost;

    # SSL/TLS Configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS headers (if frontend and API are on different origins)
    add_header Access-Control-Allow-Origin "https://localhost" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization" always;

    # Handling OPTIONS requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # ============================================
    # HEALTH CHECK ENDPOINT
    # ============================================
    location /health {
        access_log off;
        return 200 "Gateway is healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # STATIC FILES (React Frontend)
    # ============================================
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Cache control for index.html
        location = /index.html {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # ============================================
    # AUTH SERVICE
    # ============================================
    location /api/auth/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://auth_service;
        proxy_http_version 1.1;

        # Headers forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ============================================
    # ACCOUNT SERVICE
    # ============================================
    location /api/accounts/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://account_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ============================================
    # TRANSACTION SERVICE
    # ============================================
    location /api/transactions/ {
        limit_req zone=api_limit burst=15 nodelay;

        proxy_pass http://transaction_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ============================================
    # ERROR HANDLING
    # ============================================
    error_page 400 /errors/400.json;
    error_page 401 /errors/401.json;
    error_page 403 /errors/403.json;
    error_page 404 /errors/404.json;
    error_page 500 502 503 504 /errors/500.json;

    location /errors/ {
        internal;
        default_type application/json;
        root /usr/share/nginx/html;
    }

    # ============================================
    # DENY ACCESS TO SENSITIVE PATHS
    # ============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ============================================
# HTTP Server Block - REDIRECT TO HTTPS
# ============================================
server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}
