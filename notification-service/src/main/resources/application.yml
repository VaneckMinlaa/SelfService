spring:
  application:
    name: notification-service

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:your-email@gmail.com}
    password: ${SMTP_PASSWORD:app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8084

notification:
  from:
    email: ${NOTIFICATION_FROM_EMAIL:noreply@banking.local}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.banking.notification: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
