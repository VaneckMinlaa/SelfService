# ModSecurity Configuration for OWASP CRS
# Web Application Firewall (WAF)

# ============================================
# Core Settings
# ============================================

SecRuleEngine On
SecAuditEngine RelevantOnly
SecAuditLogType Serial
SecAuditLog /var/log/modsecurity/audit.log
SecDebugLog /var/log/modsecurity/debug.log
SecDebugLogLevel 3

# Request body limit (10 MB)
SecRequestBodyLimit 10485760
SecRequestBodyNoMatch Off

# Response body limit (512 KB)
SecResponseBodyLimit 524288

# ============================================
# Phase 1: Request Headers & Method Validation
# ============================================

# Reject requests with invalid HTTP methods
SecRule REQUEST_METHOD "!@within POST|GET|PUT|DELETE|PATCH|HEAD|OPTIONS|CONNECT|TRACE" \
    "id:1001,phase:1,deny,status:405,msg:'Invalid HTTP Method'"

# Reject requests without User-Agent (bots)
SecRule REQUEST_HEADERS:User-Agent "@eq" \
    "id:1002,phase:1,deny,status:403,msg:'Missing User-Agent header'"

# Reject known malicious user agents
SecRule REQUEST_HEADERS:User-Agent "@rx (sqlmap|nikto|nmap|masscan|nessus)" \
    "id:1003,phase:1,deny,status:403,msg:'Known Scanner Detected'"

# Block path traversal in URI
SecRule REQUEST_URI "@contains ../" \
    "id:1004,phase:1,deny,status:400,msg:'Path Traversal Attack Detected'"

# ============================================
# Phase 2: SQL Injection Protection
# ============================================

# Common SQL keywords in ARGS or BODY (case-insensitive)
SecRule ARGS|BODY "@rx (?i:(union|select|insert|update|delete|drop|create|alter|exec|execute|script|javascript|onerror|onload))\s*(from|into|where|values|table|database)" \
    "id:2001,phase:2,deny,status:403,msg:'SQL Injection Attempt Detected'"

# SQL comments
SecRule ARGS|BODY "@rx (--|;|/\*|\*/|xp_)" \
    "id:2002,phase:2,deny,status:403,msg:'SQL Injection Pattern Detected'"

# Time-based SQL injection
SecRule ARGS|BODY "@rx (sleep|benchmark|waitfor|pg_sleep)\s*\(" \
    "id:2003,phase:2,deny,status:403,msg:'SQL Injection (Time-based) Detected'"

# ============================================
# Phase 2: XSS (Cross-Site Scripting) Protection
# ============================================

# Script tags
SecRule ARGS|BODY "@contains <script" \
    "id:3001,phase:2,deny,status:403,msg:'XSS Script Tag Detected'"

# Event handlers
SecRule ARGS|BODY "@rx on(load|error|click|mouseover|focus|blur|change)=?['\"]?" \
    "id:3002,phase:2,deny,status:403,msg:'XSS Event Handler Detected'"

# JavaScript protocol
SecRule ARGS|BODY "@contains javascript:" \
    "id:3003,phase:2,deny,status:403,msg:'XSS JavaScript Protocol Detected'"

# Data URIs with script
SecRule ARGS|BODY "@rx data:text/html.*<script" \
    "id:3004,phase:2,deny,status:403,msg:'XSS Data URI Attack Detected'"

# Iframe tags
SecRule ARGS|BODY "@rx <iframe[^>]*>" \
    "id:3005,phase:2,deny,status:403,msg:'XSS Iframe Detected'"

# ============================================
# Phase 2: Command Injection Protection
# ============================================

# Shell metacharacters
SecRule ARGS|BODY "@rx [;&|`$()\\n]" \
    "id:4001,phase:2,allow,msg:'Shell Metacharacter Detected (Warning)'"

# Common command injection patterns
SecRule ARGS|BODY "@rx (whoami|id|ifconfig|ipconfig|netstat|cat|ls|dir|pwd)\s*;" \
    "id:4002,phase:2,deny,status:403,msg:'Command Injection Pattern Detected'"

# ============================================
# Phase 2: File Inclusion Protection
# ============================================

# Local File Inclusion (LFI)
SecRule ARGS|BODY "@rx \.\./|\.\./\.\./|/etc/passwd|/etc/shadow|windows/system32" \
    "id:5001,phase:2,deny,status:403,msg:'Local File Inclusion Attempt Detected'"

# Remote File Inclusion (RFI)
SecRule ARGS|BODY "@rx php\?file=|require_once|include_once|require|include" \
    "id:5002,phase:2,deny,status:403,msg:'Remote File Inclusion Attempt Detected'"

# ============================================
# Phase 2: Directory Traversal Protection
# ============================================

# Encoded path traversal
SecRule ARGS|BODY "@rx %2e%2e/|%252e%252e/" \
    "id:6001,phase:2,deny,status:403,msg:'Encoded Path Traversal Detected'"

# Null byte injection
SecRule ARGS|BODY "@contains %00" \
    "id:6002,phase:2,deny,status:403,msg:'Null Byte Injection Detected'"

# ============================================
# Phase 2: LDAP Injection Protection
# ============================================

SecRule ARGS|BODY "@rx \*\(|&\(|\|\(|!=|>=|<=|\)\)" \
    "id:7001,phase:2,allow,msg:'LDAP Metacharacter Detected (Warning)'"

# ============================================
# Phase 2: XXE (XML External Entity) Protection
# ============================================

SecRule ARGS|BODY "@contains <!ENTITY" \
    "id:8001,phase:2,deny,status:403,msg:'XXE Attack Detected'"

SecRule ARGS|BODY "@contains SYSTEM" \
    "id:8002,phase:2,deny,status:403,msg:'XXE External Entity Reference Detected'"

# ============================================
# Phase 2: CSRF Protection (Token Validation)
# ============================================

# For POST/PUT/DELETE requests, require X-CSRF-Token or Origin header
SecRule REQUEST_METHOD "@within POST|PUT|DELETE" \
    "chain,id:9001,phase:2,msg:'CSRF Token Validation'"
    SecRule REQUEST_HEADERS:X-CSRF-Token "@eq" \
        "chain"
        SecRule REQUEST_HEADERS:Origin "!@endsWith example.com" \
            "deny,status:403,msg:'CSRF Token Missing or Origin Mismatch'"

# ============================================
# Phase 3: Response Headers Security
# ============================================

# Ensure security headers are set
SecRule RESPONSE_HEADERS:X-Content-Type-Options "!@contains nosniff" \
    "id:10001,phase:3,log,msg:'X-Content-Type-Options Header Missing'"

SecRule RESPONSE_HEADERS:X-Frame-Options "@eq" \
    "id:10002,phase:3,log,msg:'X-Frame-Options Header Missing'"

SecRule RESPONSE_HEADERS:Strict-Transport-Security "@eq" \
    "id:10003,phase:3,log,msg:'HSTS Header Missing'"

# ============================================
# Phase 4: Outbound Content Inspection
# ============================================

# Check for sensitive data in responses
SecRule RESPONSE_BODY "@contains password" \
    "id:11001,phase:4,log,msg:'Sensitive Data (password) in Response'"

SecRule RESPONSE_BODY "@rx (credit_card|ssn|social_security)" \
    "id:11002,phase:4,log,msg:'Sensitive Data (PII) in Response'"

# ============================================
# Exceptions & Whitelist Rules
# ============================================

# Allow API health check endpoints
SecRule REQUEST_URI "@endsWith /health" \
    "id:20001,phase:2,allow"

SecRule REQUEST_URI "@endsWith /actuator/health" \
    "id:20002,phase:2,allow"

# Allow metrics endpoint (restrict IP if needed)
SecRule REQUEST_URI "@endsWith /metrics" \
    "chain,id:20003,phase:2,msg:'Metrics Access Restricted'"
    SecRule REMOTE_ADDR "!@within 127.0.0.1|::1" \
        "deny,status:403"

# Allow API endpoints (relax rules for JSON POST)
SecRule REQUEST_URI "@contains /api/" \
    "chain,id:20004,phase:2,msg:'API Request'"
    SecRule REQUEST_HEADERS:Content-Type "@contains application/json" \
        "allow"

# ============================================
# Rate Limiting (IPs with many violations)
# ============================================

# Track IPs with anomaly score > 10
SecRule TX:ANOMALY_SCORE "@gt 10" \
    "id:30001,phase:5,log,setvar:ip.violations=+1,msg:'Anomaly Threshold Exceeded'"

# Block IPs with > 10 violations in last hour (requires syslog)
SecRule IP:VIOLATIONS "@gt 10" \
    "id:30002,phase:1,deny,status:403,msg:'Rate Limit Exceeded'"

# ============================================
# Logging & Alerts
# ============================================

# Log all denied requests
SecRule RESPONSE_STATUS "@ge 400" \
    "id:40001,phase:5,log,auditlog,msg:'HTTP Error Response Logged'"

# Alert on successful exploitation attempts
SecRule TX:SEVERITY "@eq high" \
    "id:40002,phase:5,log,msg:'High Severity Alert - Check Logs'"

# ============================================
# Configuration
# ============================================

# Secure by default, but allow legitimate traffic
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"
SecDefaultAction "phase:3,log,auditlog,pass"
SecDefaultAction "phase:4,log,auditlog,pass"
SecDefaultAction "phase:5,log,auditlog,pass"

# ============================================
# End of ModSecurity Configuration
# ============================================
