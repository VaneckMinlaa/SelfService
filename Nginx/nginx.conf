# Déclarations upstream pour les microservices
upstream auth_service {
    server auth-service:8081;
}

upstream account_service {
    server account-service:8082;
}

upstream transaction_service {
    server transaction-service:8083;
}

# Limitation de débit (5 requêtes par seconde par IP pour login)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
# Limitation de débit générale pour API (100 requêtes par seconde)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

# Bloc serveur HTTPS - Passerelle API sécurisée
server {
    listen 443 ssl http2;
    server_name localhost;

    # Configuration SSL/TLS
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # En-têtes de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # En-têtes CORS (pour éviter les problèmes cross-origin)
    add_header Access-Control-Allow-Origin "https://localhost" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization" always;

    # Gestion des requêtes OPTIONS (préflight CORS)
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # ============================================
    # ENDPOINT HEALTH CHECK
    # ============================================
    location /health {
        access_log off;
        return 200 "Gateway is healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # FICHIERS STATIQUES (Frontend React)
    # ============================================
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # SERVICE D'AUTHENTIFICATION
    # ============================================
    location /api/auth/ {
        # Limiter le taux de requêtes
        limit_req zone=api_limit burst=10 nodelay;

        # Proxy vers Auth Service
        proxy_pass http://auth_service;
        proxy_http_version 1.1;

        # Transférer les en-têtes vers le backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Délais d'expiration de connexion
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Configuration du buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ============================================
    # SERVICE DE GESTION DES COMPTES
    # ============================================
    location /api/accounts/ {
        # Limiter le taux de requêtes
        limit_req zone=api_limit burst=20 nodelay;

        # Proxy vers Account Service
        proxy_pass http://account_service;
        proxy_http_version 1.1;

        # Transférer les en-têtes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        # Important: Transférer le header Authorization (JWT token)
        proxy_set_header Authorization $http_authorization;

        # Délais d'expiration
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ============================================
    # SERVICE DE TRANSACTIONS
    # ============================================
    location /api/transactions/ {
        # Limiter le taux de requêtes
        limit_req zone=api_limit burst=15 nodelay;

        # Proxy vers Transaction Service
        proxy_pass http://transaction_service;
        proxy_http_version 1.1;

        # Transférer les en-têtes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        # Important: Transférer le header Authorization (JWT token)
        proxy_set_header Authorization $http_authorization;

        # Délais d'expiration
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ============================================
    # GESTION DES ERREURS
    # ============================================
    error_page 400 /errors/400.json;
    error_page 401 /errors/401.json;
    error_page 403 /errors/403.json;
    error_page 404 /errors/404.json;
    error_page 500 502 503 504 /errors/500.json;

    location /errors/ {
        internal;
        default_type application/json;
        root /usr/share/nginx/html;
    }

    # ============================================
    # DENY ACCESS AUX CHEMINS SENSIBLES
    # ============================================
    # Bloquer l'accès aux fichiers cachés (.*)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquer les fichiers de backup (~)
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ============================================
# BLOC SERVEUR HTTP - REDIRECTION HTTPS
# ============================================
server {
    listen 80;
    server_name _;

    # Rediriger toutes les requêtes HTTP vers HTTPS
    return 301 https://$host$request_uri;
}
