# ============================================
# GitLab CI/CD Pipeline - Production Ready
# Banking Portal - Microservices
# ============================================
# Build images -> Push Registry -> Deploy VPS

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  FF_USE_FASTZIP: "true"

stages:
  - lint
  - build-push
  - deploy-staging
  - deploy-production
  - rollback
  - notify

# ============================================
# LINTING & VALIDATION
# ============================================

lint:docker-compose:
  stage: lint
  image: docker:24
  script:
    - echo "Validating docker-compose files..."
    - docker compose -f docker-compose.prod.yml config > /dev/null
    - echo "✓ docker-compose.prod.yml valid"
  allow_failure: false
  only:
    - branches

# ============================================
# BUILD & PUSH - Microservices
# ============================================

.build-template: &build-template
  stage: build-push
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo "Building $SERVICE_NAME..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build avec tags
    - docker build 
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        --build-arg VCS_REF=$CI_COMMIT_SHA
        --build-arg VERSION=$CI_COMMIT_TAG
        -t $CI_REGISTRY_IMAGE/$SERVICE_NAME:$IMAGE_TAG 
        -t $CI_REGISTRY_IMAGE/$SERVICE_NAME:latest 
        ./$DIR_NAME
    
    # Push vers registry
    - docker push $CI_REGISTRY_IMAGE/$SERVICE_NAME:$IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE/$SERVICE_NAME:latest
    - echo "✓ $SERVICE_NAME:$IMAGE_TAG pushed to registry"
  retry:
    max: 2
    when: runner_system_failure
  only:
    - main
    - develop
    - tags

build:auth-service:
  <<: *build-template
  variables:
    SERVICE_NAME: "auth-service"
    DIR_NAME: "Auth-Service"

build:account-service:
  <<: *build-template
  variables:
    SERVICE_NAME: "account-service"
    DIR_NAME: "Account-Service"

build:transaction-service:
  <<: *build-template
  variables:
    SERVICE_NAME: "transaction-service"
    DIR_NAME: "Transaction-Service"

build:notification-service:
  <<: *build-template
  variables:
    SERVICE_NAME: "notification-service"
    DIR_NAME: "Notification-Service"

build:frontend:
  <<: *build-template
  variables:
    SERVICE_NAME: "frontend"
    DIR_NAME: "Front-End"

# ============================================
# DEPLOY - Staging
# ============================================

deploy:staging:
  stage: deploy-staging
  image: alpine:latest
  environment:
    name: staging
    url: https://${STAGING_DOMAIN}
  before_script:
    - echo "Skipping staging setup"
  script:
    - echo "Staging skipped"
  needs:
    - build:auth-service
    - build:account-service
    - build:transaction-service
    - build:notification-service
    - build:frontend
  only:
    - develop
  when: on_success
  retry:
    max: 1

# ============================================
# DEPLOY - Production
# ============================================

deploy:production:
  stage: deploy-production
  image: alpine:latest
  environment:
    name: production
    url: https://${PRODUCTION_DOMAIN}
  before_script:
    - apk add --no-cache openssh-client bash curl openssl
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$PRODUCTION_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -H $PRODUCTION_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      # 1. Construction du .env
      echo "JWT_SECRET=${JWT_SECRET}" > .env
      echo "DB_USERNAME=${DB_USERNAME}" >> .env
      echo "DB_PASSWORD=${DB_PASSWORD}" >> .env
      echo "RABBITMQ_USERNAME=${RABBITMQ_USERNAME}" >> .env
      echo "RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}" >> .env
      echo "SMTP_USERNAME=${SMTP_USERNAME}" >> .env
      echo "SMTP_PASSWORD=${SMTP_PASSWORD}" >> .env
      echo "BREVO_API_KEY=${BREVO_API_KEY}" >> .env
      echo "NOTIFICATION_FROM_EMAIL=${NOTIFICATION_FROM_EMAIL}" >> .env
      echo "DOCKER_REGISTRY=${CI_REGISTRY_IMAGE}" >> .env
      echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
      echo "DOMAIN=${PRODUCTION_DOMAIN}" >> .env
      echo "GRAFANA_PASSWORD=${GRAFANA_PASSWORD}" >> .env

      # 2. Préparation du script de déploiement VPS
      cat > vps_deploy.sh << 'EOF'
      #!/bin/bash
      set -e
      source .env
      sed -i "s/DOMAIN/$DOMAIN/g" Docker/nginx-prod.conf
      find Docker/ -maxdepth 1 -name "*.conf" ! -name "nginx-prod.conf" -delete || true
      if [ ! -f "./certbot/conf/live/$DOMAIN/fullchain.pem" ]; then
        echo "🛡️ Generating dummy certificate..."
        mkdir -p "./certbot/conf/live/$DOMAIN"
        openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout "./certbot/conf/live/$DOMAIN/privkey.pem" -out "./certbot/conf/live/$DOMAIN/fullchain.pem" -subj "/CN=$DOMAIN"
        NEEDS_CERT=true
      fi
      echo $CI_JOB_TOKEN | docker login $CI_REGISTRY -u gitlab-ci-token --password-stdin
      docker compose -f docker-compose.prod.yml pull
      docker compose -f docker-compose.prod.yml up -d --remove-orphans
      if [ "$NEEDS_CERT" = "true" ]; then
        sleep 5
        docker compose -f docker-compose.prod.yml run --rm certbot certonly --webroot -w /var/www/certbot -d $DOMAIN --email $NOTIFICATION_FROM_EMAIL --agree-tos --no-eff-email --force-renewal --non-interactive
        docker compose -f docker-compose.prod.yml restart nginx
      fi
      echo " Deployment Successful!"
      docker compose -f docker-compose.prod.yml ps
      EOF

      # 3. Transfert et exécution
      scp -o StrictHostKeyChecking=no .env vps_deploy.sh docker-compose.prod.yml Docker Scripts ${PRODUCTION_USER}@${PRODUCTION_HOST}:${PRODUCTION_DEPLOY_PATH}/
      ssh -o StrictHostKeyChecking=no ${PRODUCTION_USER}@${PRODUCTION_HOST} "cd ${PRODUCTION_DEPLOY_PATH} && bash vps_deploy.sh"
  needs:
    - build:auth-service
    - build:account-service
    - build:transaction-service
    - build:notification-service
    - build:frontend
  only:
    - main
    - tags
  when: on_success
  retry:
    max: 1

# ============================================
# ROLLBACK - Production
# ============================================

rollback:production:
  stage: rollback
  image: alpine:latest
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$PRODUCTION_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -H $PRODUCTION_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $PRODUCTION_USER@$PRODUCTION_HOST "
        echo ' Rollback Initiated'
        cd $PRODUCTION_DEPLOY_PATH
        
        # Get previous backup
        LATEST_BACKUP=\$(ls -t /backups/banking/ | head -2 | tail -1)
        
        if [ -z \"\$LATEST_BACKUP\" ]; then
          echo ' No backup found for rollback'
          exit 1
        fi
        
        echo \"Using backup: \$LATEST_BACKUP\"
        
        # Stop services
        echo ' Stopping services...'
        docker compose -f docker-compose.prod.yml down
        
        # Restore database
        echo ' Restoring database...'
        chmod +x Scripts/*.sh
        ./Scripts/restore-db.sh all /backups/banking/\$LATEST_BACKUP
        
        # Start services
        echo ' Restarting services...'
        docker compose -f docker-compose.prod.yml up -d
        
        sleep 30
        
        # Verify
        echo ' Rollback Complete'
        docker compose -f docker-compose.prod.yml ps
      "
  only:
    - main
  when: manual

# ============================================
# NOTIFICATIONS
# ============================================

notify:slack:success:
  stage: notify
  image: curlimages/curl:latest
  script:
    - |
      curl -X POST -H 'Content-type: application/json' \
        --data "{
          \"text\":\" Deployment Successful\",
          \"blocks\":[
            {
              \"type\":\"section\",
              \"text\":{
                \"type\":\"mrkdwn\",
                \"text\":\"*Banking Portal - $CI_COMMIT_REF_NAME*\n*Status:*  Success\n*Commit:* $CI_COMMIT_SHA\n*Branch:* $CI_COMMIT_REF_NAME\n*Author:* $GITLAB_USER_NAME\"
              }
            }
          ]
        }" \
        $SLACK_WEBHOOK_URL
  only:
    - main
  when: on_success

notify:slack:failure:
  stage: notify
  image: curlimages/curl:latest
  script:
    - |
      curl -X POST -H 'Content-type: application/json' \
        --data "{
          \"text\":\" Deployment Failed\",
          \"blocks\":[
            {
              \"type\":\"section\",
              \"text\":{
                \"type\":\"mrkdwn\",
                \"text\":\"*Banking Portal - $CI_COMMIT_REF_NAME*\n*Status:*  Failed\n*Commit:* $CI_COMMIT_SHA\n*Author:* $GITLAB_USER_NAME\n*Check:* $CI_PIPELINE_URL\"
              }
            }
          ]
        }" \
        $SLACK_WEBHOOK_URL
  only:
    - main
  when: on_failure
