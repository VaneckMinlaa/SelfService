# ============================================
# GitLab CI/CD Pipeline - Production Ready
# Banking Portal - Microservices
# ============================================
# Build images -> Push Registry -> Deploy VPS

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  FF_USE_FASTZIP: "true"

stages:
  - lint
  - build-push
  - deploy-staging
  - deploy-production
  - rollback
  - notify

# ============================================
# LINTING & VALIDATION
# ============================================

lint:docker-compose:
  stage: lint
  image: docker:24
  script:
    - echo "Validating docker-compose files..."
    - docker compose -f docker-compose.prod.yml config > /dev/null
    - echo "✓ docker-compose.prod.yml valid"
  allow_failure: false
  only:
    - branches

# ============================================
# BUILD & PUSH - Microservices
# ============================================

.build-template: &build-template
  stage: build-push
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo "Building $SERVICE_NAME..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build avec tags
    - docker build 
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        --build-arg VCS_REF=$CI_COMMIT_SHA
        --build-arg VERSION=$CI_COMMIT_TAG
        -t $CI_REGISTRY_IMAGE/$SERVICE_NAME:$IMAGE_TAG 
        -t $CI_REGISTRY_IMAGE/$SERVICE_NAME:latest 
        ./$DIR_NAME
    
    # Push vers registry
    - docker push $CI_REGISTRY_IMAGE/$SERVICE_NAME:$IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE/$SERVICE_NAME:latest
    - echo "✓ $SERVICE_NAME:$IMAGE_TAG pushed to registry"
  retry:
    max: 2
    when: runner_system_failure
  only:
    - main
    - develop
    - tags

build:auth-service:
  <<: *build-template
  variables:
    SERVICE_NAME: "auth-service"
    DIR_NAME: "Auth-Service"

build:account-service:
  <<: *build-template
  variables:
    SERVICE_NAME: "account-service"
    DIR_NAME: "Account-Service"

build:transaction-service:
  <<: *build-template
  variables:
    SERVICE_NAME: "transaction-service"
    DIR_NAME: "Transaction-Service"

build:notification-service:
  <<: *build-template
  variables:
    SERVICE_NAME: "notification-service"
    DIR_NAME: "Notification-Service"

build:frontend:
  <<: *build-template
  variables:
    SERVICE_NAME: "frontend"
    DIR_NAME: "Front-End"

# ============================================
# DEPLOY - Staging
# ============================================

deploy:staging:
  stage: deploy-staging
  image: alpine:latest
  environment:
    name: staging
    url: https://${STAGING_DOMAIN}
  before_script:
    - echo "Skipping staging setup"
  script:
    - echo "Staging skipped"
  needs:
    - build:auth-service
    - build:account-service
    - build:transaction-service
    - build:notification-service
    - build:frontend
  only:
    - develop
  when: on_success
  retry:
    max: 1

# ============================================
# DEPLOY - Production
# ============================================

deploy:production:
  stage: deploy-production
  image: alpine:latest
  environment:
    name: production
    url: https://${PRODUCTION_DOMAIN}
  before_script:
    - apk add --no-cache openssh-client bash curl
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$PRODUCTION_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -H $PRODUCTION_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      # === ÉTAPE 0: Vérification des variables critiques ===
      if [ -z "${DB_USERNAME}" ] || [ -z "${DB_PASSWORD}" ]; then
        echo "ERROR: DB_USERNAME or DB_PASSWORD is not set in GitLab Variables!"
        echo "Please go to Settings > CI/CD > Variables and add them."
        exit 1
      fi
      if [ -z "${RABBITMQ_USERNAME}" ] || [ -z "${RABBITMQ_PASSWORD}" ]; then
        echo "ERROR: RABBITMQ_USERNAME or RABBITMQ_PASSWORD is not set in GitLab Variables!"
        echo "Please go to Settings > CI/CD > Variables and add them (and uncheck 'Protect variable')."
        exit 1
      fi

      # === ÉTAPE 1: Construction du .env dans GitLab CI ===
      echo "Building .env from GitLab CI variables..."
      printf 'JWT_SECRET="%s"\n' "${JWT_SECRET}" > .env
      printf 'DB_USERNAME=%s\n' "${DB_USERNAME}" >> .env
      printf 'DB_PASSWORD="%s"\n' "${DB_PASSWORD}" >> .env
      printf 'AUTH_DB_NAME=auth_db\n' >> .env
      printf 'ACCOUNT_DB_NAME=account_db\n' >> .env
      printf 'TRANSACTION_DB_NAME=transaction_db\n' >> .env
      printf 'RABBITMQ_HOST=rabbitmq\n' >> .env
      printf 'RABBITMQ_PORT=5672\n' >> .env
      printf 'RABBITMQ_USERNAME=%s\n' "${RABBITMQ_USERNAME}" >> .env
      printf 'RABBITMQ_PASSWORD="%s"\n' "${RABBITMQ_PASSWORD}" >> .env
      printf 'SMTP_HOST=%s\n' "${SMTP_HOST:-smtp-relay.brevo.com}" >> .env
      printf 'SMTP_PORT=%s\n' "${SMTP_PORT:-587}" >> .env
      printf 'SMTP_USERNAME="%s"\n' "${SMTP_USERNAME}" >> .env
      printf 'SMTP_PASSWORD="%s"\n' "${SMTP_PASSWORD}" >> .env
      printf 'NOTIFICATION_FROM_EMAIL="%s"\n' "${NOTIFICATION_FROM_EMAIL}" >> .env
      printf 'BREVO_API_KEY="%s"\n' "${BREVO_API_KEY}" >> .env
      printf 'AUTH_SERVICE_URL=http://auth-service:8081\n' >> .env
      printf 'ACCOUNT_SERVICE_URL=http://account-service:8082\n' >> .env
      printf 'TRANSACTION_SERVICE_URL=http://transaction-service:8083\n' >> .env
      printf 'DOCKER_REGISTRY=%s\n' "${CI_REGISTRY_IMAGE}" >> .env
      printf 'IMAGE_TAG=%s\n' "${IMAGE_TAG}" >> .env
      printf 'DOMAIN=%s\n' "${PRODUCTION_DOMAIN}" >> .env
      printf 'SESSION_SECURE=true\n' >> .env
      printf 'ENVIRONMENT=production\n' >> .env
      printf 'GRAFANA_USER=%s\n' "${GRAFANA_USER:-admin}" >> .env
      printf 'GRAFANA_PASSWORD="%s"\n' "${GRAFANA_PASSWORD}" >> .env
      printf 'LOG_LEVEL=WARN\n' >> .env
      echo ".env file built successfully."

      # === ÉTAPE 2b: Ajout des credentials registry dans .env ===
      printf 'CI_DEPLOY_TOKEN_USERNAME=%s\n' "${CI_REGISTRY_USER}" >> .env
      printf 'CI_DEPLOY_TOKEN_PASSWORD="%s"\n' "${CI_REGISTRY_PASSWORD}" >> .env
      printf 'CI_REGISTRY_IMAGE=%s\n' "${CI_REGISTRY_IMAGE}" >> .env

      # === ÉTAPE 2c: Génération du script de déploiement ===
      echo "Generating deploy script..."
      cat > deploy.sh << 'DEPLOY_SCRIPT'
      #!/bin/bash
      set -a
      source .env
      set +a

      echo "== Current Configuration (Masked) =="
      echo "User: $DB_USERNAME"
      echo "Domain: $DOMAIN"
      echo "Registry: $CI_REGISTRY_IMAGE"
      echo "Image Tag: $IMAGE_TAG"

      echo "== Configuring Nginx Domain =="
      sed -i "s/DOMAIN/$DOMAIN/g" Docker/nginx-prod.conf

      echo "== Checking SSL Certificates =="
      if [ ! -f "./certbot/conf/live/$DOMAIN/fullchain.pem" ]; then
        echo "Creating temporary dummy certificate to start Nginx..."
        mkdir -p "./certbot/conf/live/$DOMAIN"
        openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
          -keyout "./certbot/conf/live/$DOMAIN/privkey.pem" \
          -out "./certbot/conf/live/$DOMAIN/fullchain.pem" \
          -subj "/CN=$DOMAIN"
        NEEDS_REAL_CERT="true"
      fi

      echo "== Authenticating to GitLab Container Registry =="
      echo "$CI_DEPLOY_TOKEN_PASSWORD" | docker login registry.gitlab.com \
        -u "$CI_DEPLOY_TOKEN_USERNAME" --password-stdin

      echo "== Pulling latest images =="
      DOCKER_REGISTRY="$CI_REGISTRY_IMAGE" docker compose -f docker-compose.prod.yml pull

      echo "== Starting services =="
      DOCKER_REGISTRY="$CI_REGISTRY_IMAGE" docker compose -f docker-compose.prod.yml up -d || {
        echo "=========================================="
        echo "DEPLOYMENT FAILED - Analyzing containers"
        echo "=========================================="
        docker compose -f docker-compose.prod.yml ps
        echo ""
        echo "Capturing logs for unhealthy services..."
        # On récupère les noms des services qui ne sont pas "Up" ou "healthy"
        services=$(docker compose -f docker-compose.prod.yml ps --format "{{.Service}}" | xargs)
        for service in $services; do
          echo "--- Logs for $service ---"
          docker compose -f docker-compose.prod.yml logs --tail 50 "$service"
        done
        exit 1
      }

      if [ "$NEEDS_REAL_CERT" = "true" ]; then
        echo "== Waiting for Nginx to initialize =="
        sleep 10
        echo "== Requesting REAL Let's Encrypt Certificate =="
        docker compose -f docker-compose.prod.yml exec -T certbot certbot certonly --webroot -w /var/www/certbot -d $DOMAIN --email $NOTIFICATION_FROM_EMAIL --rsa-key-size 4096 --agree-tos --force-renewal --non-interactive
      fi

      echo "== Reloading Nginx configuration =="
      docker compose -f docker-compose.prod.yml exec -T nginx-gateway nginx -s reload || true

      echo "== DIAGNOSTIC : STATUS DES CONTENEURS =="
      docker compose -f docker-compose.prod.yml ps
      echo "== DIAGNOSTIC : LOGS NGINX =="
      docker logs --tail 50 nginx-gateway || true

      docker logout registry.gitlab.com
      echo "== Cleanup old images =="
      docker image prune -f
      echo "Deployment complete at $(date)!"
      DEPLOY_SCRIPT
      chmod +x deploy.sh

      # === ÉTAPE 3: Transfert des fichiers vers le VPS ===
      echo "Transferring files to VPS..."
      scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -r \
        .env deploy.sh docker-compose.prod.yml Docker Scripts Nginx \
        ${PRODUCTION_USER}@${PRODUCTION_HOST}:${PRODUCTION_DEPLOY_PATH}/

      # === ÉTAPE 4: Exécution du script de déploiement sur le VPS ===
      echo "Launching deployment via SSH..."
      ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
        ${PRODUCTION_USER}@${PRODUCTION_HOST} \
        "cd ${PRODUCTION_DEPLOY_PATH} && chmod +x Scripts/*.sh && bash deploy.sh"
  needs:
    - build:auth-service
    - build:account-service
    - build:transaction-service
    - build:notification-service
    - build:frontend
  only:
    - main
    - tags
  when: on_success
  retry:
    max: 1

# ============================================
# ROLLBACK - Production
# ============================================

rollback:production:
  stage: rollback
  image: alpine:latest
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$PRODUCTION_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -H $PRODUCTION_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $PRODUCTION_USER@$PRODUCTION_HOST "
        echo ' Rollback Initiated'
        cd $PRODUCTION_DEPLOY_PATH
        
        # Get previous backup
        LATEST_BACKUP=\$(ls -t /backups/banking/ | head -2 | tail -1)
        
        if [ -z \"\$LATEST_BACKUP\" ]; then
          echo ' No backup found for rollback'
          exit 1
        fi
        
        echo \"Using backup: \$LATEST_BACKUP\"
        
        # Stop services
        echo ' Stopping services...'
        docker compose -f docker-compose.prod.yml down
        
        # Restore database
        echo ' Restoring database...'
        chmod +x Scripts/*.sh
        ./Scripts/restore-db.sh all /backups/banking/\$LATEST_BACKUP
        
        # Start services
        echo ' Restarting services...'
        docker compose -f docker-compose.prod.yml up -d
        
        sleep 30
        
        # Verify
        echo ' Rollback Complete'
        docker compose -f docker-compose.prod.yml ps
      "
  only:
    - main
  when: manual

# ============================================
# NOTIFICATIONS
# ============================================

notify:slack:success:
  stage: notify
  image: curlimages/curl:latest
  script:
    - |
      curl -X POST -H 'Content-type: application/json' \
        --data "{
          \"text\":\" Deployment Successful\",
          \"blocks\":[
            {
              \"type\":\"section\",
              \"text\":{
                \"type\":\"mrkdwn\",
                \"text\":\"*Banking Portal - $CI_COMMIT_REF_NAME*\n*Status:*  Success\n*Commit:* $CI_COMMIT_SHA\n*Branch:* $CI_COMMIT_REF_NAME\n*Author:* $GITLAB_USER_NAME\"
              }
            }
          ]
        }" \
        $SLACK_WEBHOOK_URL
  only:
    - main
  when: on_success

notify:slack:failure:
  stage: notify
  image: curlimages/curl:latest
  script:
    - |
      curl -X POST -H 'Content-type: application/json' \
        --data "{
          \"text\":\" Deployment Failed\",
          \"blocks\":[
            {
              \"type\":\"section\",
              \"text\":{
                \"type\":\"mrkdwn\",
                \"text\":\"*Banking Portal - $CI_COMMIT_REF_NAME*\n*Status:*  Failed\n*Commit:* $CI_COMMIT_SHA\n*Author:* $GITLAB_USER_NAME\n*Check:* $CI_PIPELINE_URL\"
              }
            }
          ]
        }" \
        $SLACK_WEBHOOK_URL
  only:
    - main
  when: on_failure
