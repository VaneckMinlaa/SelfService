# Sert uniquement les fichiers statiques. En prod, le reverse proxy (docker/nginx.conf)
# route / vers ce conteneur et /api vers le backend.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Désactiver le cache pour index.html pour forcer le navigateur à télécharger la nouvelle version à chaque mise à jour
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
